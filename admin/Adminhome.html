    <meta charset="UTF-8" />

        <ion-icon name="menu"></ion-icon>

  <!-- <div id="app"></div> -->

    <h2>Top Blogs</h2>

      <!-- blogs will appear here -->
    </div>
   </div>

   <div class="blog-actions">
    <a class="hot" href="writeblog.html"><ion-icon name="add"></ion-icon>Create Blog</a>

    <div class="stat">
