<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css">
    <script src="controllers/account.js" type="module" defer></script>
    <script src="src/main.js" type="module" defer></script>
    <title>Lien's Movies</title>
  </head>
  <body>

    <!-- header section -->
    <header>
      <div class="logo">LM</div>

      <!-- dark day mode controller, notifications and menu -->
      <div class="controls">
        <ion-icon name="sunny"></ion-icon>
        <ion-icon name="notifications"></ion-icon>
        <ion-icon name="menu"></ion-icon>
      </div>
  </header>
  <!-- <div id="app"></div> -->


  <!-- account_info -->
   <div class="account">

    <div class="identity">
      <div id="user-pic" class="profile_pic logo">...</div>
      <h2 id="username">Loading...</h2>
    </div>

    <div class="basic_info">

        <div class="info_item">
          <h3>Created On:</h3>
          <p id="date-created">Loading...</p>
        </div>

        <div class="info_item">
          <h3>Email:</h3>
          <p id="email">Loading...</p>        
        </div>

      </div>

      <div class="stats">
        <h2>Stats</h2>

        <div class="stat-group">

          <div class="stat">
            <ion-icon name="heart"></ion-icon>
            <p>Blogs Liked</p>
            <p id="likes">...</p>
          </div>

          <div class="stat">
            <ion-icon name="chatbubble-outline"></ion-icon>
            <p>Comments</p>
            <p id="comments">...</p>
          </div>
        </div>
      </div>


      <div class="btn_group">
        <button id="delete-account" class="btn" style="background: #FF4343; color: white;">Delete Account</button>
        <button id="logout" class="btn">Logout</button>
      </div>

    </div>
  


<!-- bottom navs -->
    
    <div class="bottomnavs">
      <div class="menu_item">
        <ion-icon name="compass"></ion-icon>
        <a href="explore.html">Explore</a>
      </div>

      <div class="menu_item">
        <ion-icon name="home"></ion-icon>
        <a id="home" href="index.html">Home</a>
      </div>

      <div class="menu_item" style="color: #16DB65;">
        <ion-icon name="person"></ion-icon>
        <a href="account.html">Account</a>
      </div>
    </div>

    <!-- scripts -->

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </body>
</html>
